baseURL = 'https://blog.uri-bushey.com/'
locale = 'en-us'
title = 'Uri Bushey'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 20

[params]
  # Sign up at goatcounter.com, then set this to your site code to enable analytics.
  # goatcounter = 'uribushey'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  defaultTheme = 'dark'
  description = 'Notes on product, data, and building with AI.'

  [params.homeInfoParams]
    Title = 'uri-bushey'
    Content = "Notes on product, data, and building with AI. Mostly the last one.\n\nThe rest of me lives at [uri-bushey.com](https://uri-bushey.com)."

[[menu.main]]
  name = 'posts'
  url = '/posts/'
  weight = 1
[[menu.main]]
  name = 'uri-bushey.com'
  url = 'https://uri-bushey.com'
  weight = 2

[outputs]
  home = ['HTML', 'RSS']
