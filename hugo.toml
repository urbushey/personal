baseURL = 'https://blog.uri-bushey.com/'
locale = 'en-us'
title = 'Uri Bushey'
theme = 'terminal'

enableRobotsTXT = true
buildDrafts = false

[pagination]
  pagerSize = 10

[markup.goldmark.renderer]
  unsafe = true

[params]
  # Sign up at goatcounter.com, then set this to your site code to enable analytics.
  # goatcounter = 'uribushey'
  contentTypeName = 'posts'
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = true
  description = 'Notes on product, data, and building with AI.'
  subtitle = 'Notes on product, data, and building with AI.'
  readMore = 'Read more'
  readOtherPosts = 'Read other posts'

  [params.logo]
    logoText = 'Uri Bushey'
    logoHomeLink = '/'

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts'
  weight = 1
[[menu.main]]
  identifier = 'main-site'
  name = 'uri-bushey.com'
  url = 'https://uri-bushey.com'
  weight = 2

[outputs]
  home = ['HTML', 'RSS']
